name: Ruin
version: 3.0.0
main: com.aurasmp.ruin.RuinPlugin
api-version: '1.21'
author: AuraSMP
description: "Deepwoken-style kill-to-level progression: stats, talent hands and manifestations."
commands:
  ruin:
    description: Ruin progression commands.
    usage: |
      /ruin build [player] - open your build menu (admin can edit others)
      /ruin level give <player> <amount> - give a player levels (admin)
      /ruin level add <amount> [player] - add levels (admin)
      /ruin xp <amount> [player] - grant XP (admin)
      /ruin give <mirror|catalyst> [player] [amount] - admin give
      /ruin reset [player] - reset progression
      /ruin reload - reload config.yml (admin)
    permission: ruin.use
  stats:
    description: Open the stats menu to invest stat points.
    usage: /stats
    aliases: [st, attributes]
    permission: ruin.use
  manifest:
    description: Equip and unequip your learned manifestations.
    usage: /manifest
    aliases: [mani, equip]
    permission: ruin.use
  trust:
    description: Mark a player as a trusted ally (your manifestations spare them).
    usage: |
      /trust <player> - trust an ally
      /trust remove <player> - stop trusting them
      /trust list - show your trusted allies
    permission: ruin.use
  untrust:
    description: Stop trusting a player.
    usage: /untrust <player>
    permission: ruin.use
permissions:
  ruin.use:
    description: Use the /ruin command.
    default: true
  ruin.admin:
    description: Admin Ruin commands (give, reset, xp for others).
    default: op
